name: Top-Tipps aktualisieren

# Jede Stunde, rund um die Uhr (Niklas: „die KI soll immer neu nach Top-Matches suchen“): alle kommenden Spiele mit Quoten neu
# holen (ESPN, 40+ Ligen und Pokale, 3 Wochen voraus), Tipps, Sicher, Top-Quote und Kombis neu rechnen, Bilanz auswerten,
# KI-Zentrale fortschreiben, veröffentlichen.
# Absicherung, weil GitHub geplante Läufe oft verschluckt oder stundenlang verzögert (06.11.2026: 9 Stunden lang kein einziger
# der Termine alle 10 Minuten gestartet):
#  - Hauptzeitgeber ist der Cloudflare-Server (worker/worker.js, alle 30 Minuten): er startet diesen Workflow über die GitHub-API
#    (workflow_dispatch, via=zeitgeber), sobald die veröffentlichte Suche älter als 50 Minuten ist – das kommt sofort an
#  - GitHubs eigene Termine (2× pro Stunde) bleiben als Ersatz; sie rechnen nur, wenn die veröffentlichte Suche älter als
#    50 Minuten ist (sonst endet der Lauf nach ein paar Sekunden im Prüf-Schritt)
#  - von Hand gestartet (Actions → Run workflow) wird immer gerechnet
#  - fehlen die Stärken von heute (Stärken-Lauf ausgefallen), rechnet dieser Lauf sie zuerst nach
#  - die Tipp-Datei selbst wird nur veröffentlicht, nicht gespeichert (hält das Repository klein); gespeichert werden Bilanz,
#    Protokoll und ggf. die Stärken
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      via:
        description: 'Wer startet? (zeitgeber = Cloudflare-Server, hand = von Hand)'
        required: false
        default: 'hand'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.need.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Nötig? (geplante Termine nur, wenn die letzte Suche älter als 50 Minuten ist)
        id: need
        run: |
          age=$(python3 scripts/stale.py https://sneaxx141108-gif.github.io/result-ai/data/tips.json)
          echo "Letzte veröffentlichte Suche vor $age Minuten"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$age" -lt 50 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  tips:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages   # alle Veröffentlichungen nacheinander: GitHub Pages erlaubt nur eine gleichzeitig (App, Stärken, Tipps)
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stärken nachholen, falls die von heute fehlen
        run: python3 scripts/ratings.py --if-stale
      - name: Tipps rechnen (Sicher, Empfohlen, Top-Quote, Kombis, Bilanz)
        env:
          RA_VIA: ${{ github.event_name == 'schedule' && 'github' || inputs.via || 'hand' }}  # für die KI-Zentrale
        run: python3 scripts/tips.py
      - name: Prüfen (bei Fehlern bleibt die alte Version online)
        run: |
          node tests/engine.test.js
          node tests/ratings.test.js
          node tests/tips.test.js
      - name: Speichern (Bilanz, Protokoll, ggf. Stärken)
        run: |
          git config user.name "result-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/tips_log.json web/data/activity.json web/data/ratings.json
          if git diff --cached --quiet; then
            echo "Keine Änderung"
          else
            git commit -m "Tipps $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
            cp web/data/tips.json /tmp/tips.json
            git checkout -- web/data/tips.json
            git pull --rebase -X theirs origin main
            git push
            cp /tmp/tips.json web/data/tips.json
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

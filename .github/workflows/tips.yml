name: Top-Tipps aktualisieren

# Jede Stunde, rund um die Uhr (Niklas: „die KI soll immer neu nach Top-Matches suchen“): alle kommenden Spiele mit
# Quoten neu holen (ESPN, 40+ Ligen und Pokale), Tipps neu rechnen (scripts/tips.py, ohne KI), Bilanz auswerten, veröffentlichen.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ratings   # nie gleichzeitig mit dem Stärken-Rechner – beide schreiben nach web/data und veröffentlichen
  cancel-in-progress: false

jobs:
  tips:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Tipps rechnen
        run: python3 scripts/tips.py
      - name: Tipps prüfen (bei Fehlern bleibt die alte Version online)
        run: node tests/tips.test.js
      - name: Speichern
        run: |
          git config user.name "result-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/tips.json web/data/tips_log.json
          if git diff --cached --quiet; then
            echo "Keine Änderung"
          else
            git commit -m "Tipps $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
            git pull --rebase -X theirs origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

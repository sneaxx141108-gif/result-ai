name: App veröffentlichen

# Legt die App (Ordner web/) bei jeder Änderung auf GitHub Pages. Vorher laufen die Tests des Rechen-Kerns.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages   # alle Veröffentlichungen nacheinander: GitHub Pages erlaubt nur eine gleichzeitig (App, Stärken, Tipps)
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # der Server-Test braucht die eingebaute SQLite (ab Node 22.13)
      - name: Rechen-Kern testen
        run: node tests/engine.test.js
      - name: Stärken-Datei prüfen
        run: node tests/ratings.test.js
      - name: Tipp-Datei prüfen
        run: node tests/tips.test.js
      - name: Abgleich Handy/iPad prüfen
        run: node tests/sync.test.js
      - name: Server prüfen (Konten, Spiel-Scan)
        run: node tests/worker.test.mjs
      - name: Frische Tipps behalten (die veröffentlichte Tipp-Datei ist neuer als die im Repository)
        run: |
          if curl -sf -o /tmp/tips.json "https://sneaxx141108-gif.github.io/result-ai/data/tips.json?nc=$(date +%s)" && python3 -c "import json; json.load(open('/tmp/tips.json'))"; then
            cp /tmp/tips.json web/data/tips.json
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

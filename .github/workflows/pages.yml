name: App veröffentlichen

# Legt die App (Ordner web/) bei jeder Änderung auf GitHub Pages. Vorher laufen die Tests (Wett-Codes, Abgleich, Server, Spielplan).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages   # alle Veröffentlichungen nacheinander: GitHub Pages erlaubt nur eine gleichzeitig (App und Spielplan)
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # der Server-Test braucht die eingebaute SQLite (ab Node 22.13)
      - name: Wett-Codes prüfen (Wettschein-Tipps erkennen und abrechnen)
        run: node tests/pick.test.mjs
      - name: Abgleich Handy/iPad prüfen
        run: node tests/sync.test.js
      - name: Server prüfen (Konten, Wettschein-Leser, Zeitgeber)
        run: node tests/worker.test.mjs
      - name: Frischen Spielplan behalten (der veröffentlichte ist neuer als der im Repository)
        run: |
          if curl -sf -o /tmp/games.json "https://sneaxx141108-gif.github.io/result-ai/data/games.json?nc=$(date +%s)" && python3 -c "import json; json.load(open('/tmp/games.json'))"; then
            cp /tmp/games.json web/data/games.json
          fi
      - name: Spielplan prüfen
        run: node tests/games.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

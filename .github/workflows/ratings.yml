name: Stärken neu rechnen

# Einmal am Tag gültig (gleiches Spiel am selben Tag = gleiche Zahlen, Niklas' Regel): Ergebnisse, xG und Quoten aus 57 Ligen
# + Europapokal holen und die Stärken aller Teams neu schätzen (scripts/ratings.py, ohne KI).
# Absicherung, weil GitHub geplante Läufe manchmal verschluckt oder stundenlang verzögert: 5 Versuche über den Tag verteilt –
# gerechnet wird nur, solange die Stärken von heute (deutsche Zeit) noch fehlen (--if-stale); dazu holt auch die stündliche
# Tipp-Suche fehlende Stärken nach.
on:
  schedule:
    - cron: '35 1 * * *'
    - cron: '35 5 * * *'
    - cron: '35 9 * * *'
    - cron: '35 14 * * *'
    - cron: '35 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages   # alle Veröffentlichungen nacheinander: GitHub Pages erlaubt nur eine gleichzeitig (App, Stärken, Tipps)
  cancel-in-progress: false

jobs:
  ratings:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stärken rechnen (nur, wenn die von heute noch fehlen)
        run: python3 scripts/ratings.py --if-stale
      - name: Stärken prüfen (bei Fehlern bleibt die alte Version online)
        run: node tests/ratings.test.js
      - name: Speichern
        id: save
        run: |
          git config user.name "result-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/ratings.json web/data/activity.json
          if git diff --cached --quiet; then
            echo "Keine Änderung"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Stärken $(TZ=Europe/Berlin date '+%d.%m.%Y')"
            git pull --rebase -X theirs origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Frische Tipps behalten (die veröffentlichte Tipp-Datei ist neuer als die im Repository)
        if: steps.save.outputs.changed == 'true'
        run: |
          if curl -sf -o /tmp/tips.json "https://sneaxx141108-gif.github.io/result-ai/data/tips.json?nc=$(date +%s)" && python3 -c "import json; json.load(open('/tmp/tips.json'))"; then
            cp /tmp/tips.json web/data/tips.json
          fi
      - name: Rechen-Kern testen
        if: steps.save.outputs.changed == 'true'
        run: node tests/engine.test.js
      - uses: actions/configure-pages@v5
        if: steps.save.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.save.outputs.changed == 'true'
        with:
          path: web
      - id: deployment
        if: steps.save.outputs.changed == 'true'
        uses: actions/deploy-pages@v4

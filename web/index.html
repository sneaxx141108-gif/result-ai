<style>
/* Ladebildschirm: steht sofort, noch bevor die App geladen ist (Wettschein mit Haken + Name wie auf den Startbildern; nur transform/opacity) */
#splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #F2F2F7; color: #0B0B0C; transition: opacity .36s ease; }
:root[data-theme="dark"] #splash { background: #000; color: #fff; }
#splash svg { width: 68px; height: 68px; animation: sp-mark .55s cubic-bezier(.2, .8, .2, 1) both; transition: transform .36s ease; }
#splash b { height: 26px; font: 700 22px/26px -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif; letter-spacing: -.03em; animation: sp-name .55s cubic-bezier(.2, .8, .2, 1) .1s both; }
#splash .s { fill: #0B0B0C; }
#splash .l { fill: none; stroke: #F2F2F7; stroke-width: 2.6; stroke-linecap: round; }
#splash .g { fill: #16A34A; stroke: #F2F2F7; stroke-width: 2.5; }
#splash .k { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
:root[data-theme="dark"] #splash .s { fill: #fff; }
:root[data-theme="dark"] #splash .l { stroke: #000; }
:root[data-theme="dark"] #splash .g { fill: #30D158; stroke: #000; }
:root[data-theme="dark"] #splash .k { stroke: #00210B; }
#splash.out { opacity: 0; pointer-events: none; }
#splash.out svg { transform: scale(1.1); }
@keyframes sp-mark { from { opacity: 0; transform: scale(.9); } }
@keyframes sp-name { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { #splash svg, #splash b { animation: none; } }

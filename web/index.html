<head>

<link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="icons/splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" href="icons/splash-1170x2532-dark.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="icons/splash-1284x2778.png">

<script>try { var th = JSON.parse(localStorage.getItem('ra_theme')); if (th === 'dark' || (th === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.dataset.theme = 'dark'; document.querySelector('meta[name="theme-color"]').content = '#000000'; } } catch (e) {}</script>
<style>
/* Ladebildschirm: steht sofort, noch bevor die App geladen ist (Ring + Name wie auf den Startbildern; nur transform/opacity) */
#splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #F2F2F7; color: #0B0B0C; transition: opacity .36s ease; }
:root[data-theme="dark"] #splash { background: #000; color: #fff; }
#splash svg { width: 68px; height: 68px; animation: sp-ring .7s cubic-bezier(.2, .8, .2, 1) both; transition: transform .36s ease; }
#splash b { height: 26px; font: 700 22px/26px -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif; letter-spacing: -.03em; animation: sp-name .55s cubic-bezier(.2, .8, .2, 1) .1s both; }
#splash .a { stroke: #0B0B0C; }
#splash .b { stroke: #AEAEB2; }
#splash .c { stroke: #C7C7CC; }
:root[data-theme="dark"] #splash .a { stroke: #fff; }
:root[data-theme="dark"] #splash .b { stroke: #636366; }
:root[data-theme="dark"] #splash .c { stroke: #48484A; }
#splash.out { opacity: 0; pointer-events: none; }
#splash.out svg { transform: scale(1.1); }
@keyframes sp-ring { from { opacity: 0; transform: rotate(-70deg) scale(.88); } }
@keyframes sp-name { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { #splash svg, #splash b { animation: none; } }
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><svg viewBox="0 0 36 36"><g fill="none" stroke-width="5" stroke-linecap="round" transform="rotate(-90 18 18)"><circle class="a" cx="18" cy="18" r="13" pathLength="100" stroke-dasharray="44 56"/><circle class="b" cx="18" cy="18" r="13" pathLength="100" stroke-dasharray="20 80" stroke-dashoffset="-52"/><circle class="c" cx="18" cy="18" r="13" pathLength="100" stroke-dasharray="16 84" stroke-dashoffset="-80"/></g></svg><b>Result AI</b></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
